<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pocong Hunter: Dark Night - Boss & Level Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@400;600;800&display=swap');
        
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background-color: #050508;
            color: #fff;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .font-horror {
            font-family: 'Creepster', cursive;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes redGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.8); }
        }
        .glow-btn {
            animation: redGlow 2s infinite;
        }

        #rotate-device-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, 0.98);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        @media screen and (orientation: portrait) {
            #rotate-device-overlay {
                display: flex;
            }
        }
    </style>
</head>
<body class="bg-black text-white select-none">

    <!-- WARNING OVERLAY FOR PORTRAIT -->
    <div id="rotate-device-overlay">
        <div class="text-amber-500 text-6xl mb-4 animate-bounce">
            <i class="fa-solid fa-mobile-screen-button rotate-90"></i>
        </div>
        <h2 class="text-2
